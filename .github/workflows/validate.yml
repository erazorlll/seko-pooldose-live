name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly - catches drift from new HACS/hassfest rules
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: pip install pytest homeassistant pytest-homeassistant-custom-component

      # Pure library logic, no HA fixture overhead needed.
      - name: pooldose_live library tests
        run: python -m pytest tests/test_write.py tests/test_vendor_sync.py -v

      # Manual scripts instead of pytest fixtures - see README/tests/test_p2_manual.py
      # for the Windows fcntl rationale. Runs here on Linux without that specific
      # problem, but deliberately stays the same script as tested locally.
      - name: HA integration tests (P2-P5)
        run: |
          for f in tests/test_p2_manual.py tests/test_p3_manual.py tests/test_p4_manual.py tests/test_p5_manual.py; do
            echo "=== $f ==="
            python "$f"
          done
