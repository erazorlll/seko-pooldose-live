name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # woechentlich - faengt Drift durch neue HACS/hassfest-Regeln ab
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: pip install pytest homeassistant pytest-homeassistant-custom-component

      # Reine Bibliothekslogik, kein HA-Fixture-Overhead noetig.
      - name: pooldose_live-Bibliothekstests
        run: python -m pytest tests/test_write.py tests/test_vendor_sync.py -v

      # Manuelle Skripte statt pytest-Fixtures - siehe README/tests/test_p2_manual.py
      # fuer die Windows-fcntl-Begruendung. Laeuft hier auf Linux zwar ohne das
      # konkrete Problem, bleibt aber bewusst dasselbe Skript wie lokal getestet.
      - name: HA-Integrationstests (P2-P5)
        run: |
          for f in tests/test_p2_manual.py tests/test_p3_manual.py tests/test_p4_manual.py tests/test_p5_manual.py; do
            echo "=== $f ==="
            python "$f"
          done
